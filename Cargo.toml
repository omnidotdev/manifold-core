[package]
name = "manifold-core"
version = "0.1.0"
edition = "2021"
authors = ["Omni <team@omni.dev>"]
description = "Core library for Manifold universal artifact registry"
license = "Apache-2.0"
repository = "https://github.com/omnidotdev/manifold-core"
homepage = "https://manifold.omni.dev"
readme = "README.md"
keywords = ["registry", "artifact", "manifold"]
categories = ["development-tools"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid"] }

# HTTP client (for proxying to upstream registries)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# Hashing/digests
sha2 = "0.10"
hex = "0.4"

# OCI spec types
oci-spec = "0.7"

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Tracing
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Bytes handling
bytes = "1"

# Content type detection
infer = "0.16"

[dev-dependencies]
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy", "run-cargo-test"] }
tempfile = "3"
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
