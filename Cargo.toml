[package]
name = "manifold-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Manifold universal artifact registry"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "chrono", "uuid"] }

# HTTP client (for proxying to upstream registries)
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# Hashing/digests
sha2 = "0.10"
hex = "0.4"

# OCI spec types
oci-spec = "0.7"

# Error handling
thiserror = "2"
anyhow = "1"

# Async traits
async-trait = "0.1"

# Tracing
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Bytes handling
bytes = "1"

# Content type detection
infer = "0.16"

[dev-dependencies]
tokio-test = "0.4"
